name: Build IPA

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build and report errors
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          set +o pipefail
          xcodebuild build \
            -project LocalGallery.xcodeproj \
            -scheme LocalGallery \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]:-$?}
          if [ "$BUILD_EXIT" != "0" ]; then
            echo ""
            echo "========== BUILD ERRORS =========="
            grep 'error:' build.log | head -40
            echo "========== END ERRORS =========="
            echo ""
            if [ -n "$PR_NUMBER" ]; then
              echo 'Build failed. Compiler errors:' > /tmp/comment.md
              echo '```' >> /tmp/comment.md
              grep 'error:' build.log | head -30 >> /tmp/comment.md
              echo '' >> /tmp/comment.md
              tail -10 build.log >> /tmp/comment.md
              echo '```' >> /tmp/comment.md
              gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md || echo "Failed to post PR comment"
            fi
            exit 1
          fi

      - name: Archive
        run: |
          xcodebuild archive \
            -project LocalGallery.xcodeproj \
            -scheme LocalGallery \
            -destination "generic/platform=iOS" \
            -archivePath build/LocalGallery.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          mkdir -p build/Payload
          cp -r build/LocalGallery.xcarchive/Products/Applications/LocalGallery.app build/Payload/
          cd build && zip -r LocalGallery.ipa Payload

      - name: Upload IPA to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/LocalGallery.ipa
