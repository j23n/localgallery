[package]
name = "gallery-memories"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# `gallery_model::text` supplies the NFC folds that make a Rust `HashMap` key
# agree with the Swift `Dictionary`/`Set<String>` it replaces.
gallery-model = { path = "../gallery-model" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
