name: Build IPA

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build
        run: |
          set +e
          xcodebuild build \
            -project LocalGallery.xcodeproj \
            -scheme LocalGallery \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log
          RESULT=${PIPESTATUS[0]}
          echo "xcodebuild_exit=$RESULT" >> "$GITHUB_ENV"
          exit $RESULT

      - name: Post build errors to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo 'CI build errors from xcodebuild:' > comment.md
          echo '```' >> comment.md
          grep 'error:' build.log | head -30 >> comment.md || echo 'No lines matching error: found' >> comment.md
          echo '' >> comment.md
          echo '--- last 15 lines ---' >> comment.md
          tail -15 build.log >> comment.md
          echo '```' >> comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Archive
        run: |
          xcodebuild archive \
            -project LocalGallery.xcodeproj \
            -scheme LocalGallery \
            -destination "generic/platform=iOS" \
            -archivePath build/LocalGallery.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          mkdir -p build/Payload
          cp -r build/LocalGallery.xcarchive/Products/Applications/LocalGallery.app build/Payload/
          cd build && zip -r LocalGallery.ipa Payload

      - name: Upload IPA to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/LocalGallery.ipa
