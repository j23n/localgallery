name: Build IPA

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build
        run: |
          set -o pipefail
          xcodebuild archive \
            -project LocalGallery.xcodeproj \
            -scheme LocalGallery \
            -destination "generic/platform=iOS" \
            -archivePath build/LocalGallery.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

      - name: Post build errors to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "**Build failed** (exit code 65)"
            echo ""
            echo '```'
            grep " error:" build.log | head -30 || echo "No error: lines found"
            echo '```'
            echo ""
            echo "<details><summary>Last 30 lines</summary>"
            echo ""
            echo '```'
            tail -30 build.log
            echo '```'
            echo "</details>"
          } > comment_body.txt
          gh pr comment "$PR_NUMBER" --body-file comment_body.txt

      - name: Create IPA
        run: |
          mkdir -p build/Payload
          cp -r build/LocalGallery.xcarchive/Products/Applications/LocalGallery.app build/Payload/
          cd build && zip -r LocalGallery.ipa Payload

      - name: Upload IPA to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/LocalGallery.ipa
