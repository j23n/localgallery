[package]
name = "gallery-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Swift's `String.contains` matches by CANONICAL EQUIVALENCE, not bytes: a
# precomposed query finds a decomposed filename. Normalising both sides to NFC
# is how that survives the port — `gallery_model::text`, re-exported as this
# crate's `text`.
gallery-model = { path = "../gallery-model" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
