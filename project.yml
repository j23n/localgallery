name: LocalGallery
options:
  bundleIdPrefix: com.localgallery
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  LocalGallery:
    type: application
    platform: iOS
    sources:
      - path: LocalGallery
        excludes:
          - Info.plist
          - LocalGallery.entitlements
    info:
      path: LocalGallery/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.localgallery.app
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - localgallery
        NSContactsUsageDescription: "LocalGallery uses your contacts to surface birthday memories for the people in your photos. Names are matched only against your photo tags — nothing leaves the device."
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.localgallery.app.dailyMemories
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localgallery.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: LocalGallery/LocalGallery.entitlements
    dependencies:
      - target: LocalGalleryWidgets

  LocalGalleryWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LocalGalleryWidgets
        excludes:
          - Info.plist
          - LocalGalleryWidgets.entitlements
      - path: LocalGallery/Shared
    info:
      path: LocalGalleryWidgets/Info.plist
      properties:
        CFBundleDisplayName: LocalGallery
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localgallery.app.widgets
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: LocalGalleryWidgets/LocalGalleryWidgets.entitlements
        SKIP_INSTALL: "YES"
