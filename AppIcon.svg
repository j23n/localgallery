<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Orange background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8871E"/>
      <stop offset="100%" stop-color="#B05A0A"/>
    </linearGradient>
    <!-- Neutral beige folder -->
    <linearGradient id="folderBody" x1="512" y1="320" x2="512" y2="810" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5EADB"/>
      <stop offset="100%" stop-color="#E2CDAF"/>
    </linearGradient>
    <linearGradient id="folderTab" x1="300" y1="220" x2="300" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF2E8"/>
      <stop offset="100%" stop-color="#EEDDCA"/>
    </linearGradient>
    <!-- Sky gradient for photo -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5DADE2"/>
      <stop offset="100%" stop-color="#AED6F1"/>
    </linearGradient>
    <filter id="folderShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="polaroidShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <ellipse cx="512" cy="540" rx="380" ry="300" fill="#fff" opacity="0.06"/>

  <!-- FOLDER -->
  <g filter="url(#folderShadow)">
    <path d="M140,320 L140,255 Q140,220 175,220 L375,220 Q405,220 418,250 L445,320" fill="url(#folderTab)"/>
    <rect x="112" y="320" width="800" height="490" rx="32" fill="url(#folderBody)"/>
  </g>

  <!-- POLAROID (lip on left, slightly tilted) -->
  <g filter="url(#polaroidShadow)" transform="rotate(-2, 512, 565)">
    <!-- White frame -->
    <rect x="242" y="375" width="540" height="380" rx="4" fill="#FFFFFF"/>
    <rect x="242" y="375" width="540" height="380" rx="4" fill="none" stroke="#E8E4E0" stroke-width="1"/>

    <!-- Photo area (offset right, leaving thick left lip) -->
    <rect x="332" y="399" width="426" height="332" rx="2" fill="url(#sky)"/>

    <!-- Landscape scene inside photo -->
    <!-- Sun -->
    <circle cx="670" cy="445" r="30" fill="#F4D03F" opacity="0.8"/>
    <!-- Far mountains -->
    <path d="M332,640 L410,560 L470,600 L540,530 L610,580 L680,540 L758,640 Z" fill="#5B8C5A" opacity="0.5"/>
    <!-- Near hills -->
    <path d="M332,700 L400,620 L470,665 L545,600 L620,650 L690,610 L758,700 Z" fill="#4A7C49" opacity="0.7"/>
    <!-- Ground -->
    <rect x="332" y="685" width="426" height="46" fill="#6AAF6A" opacity="0.6"/>
  </g>
</svg>
