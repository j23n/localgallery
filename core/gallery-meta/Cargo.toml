[package]
name = "gallery-meta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gallery-model = { path = "../gallery-model" }
gallery-vfs = { path = "../gallery-vfs" }
# Pinned to the exact version `gallery-ml` pins: both crates parse the same
# EXIF, and a patch bump that changed a rational-to-float rounding would move
# GPS coordinates in one of them only.
kamadak-exif = "=0.6.1"
quick-xml = "0.41"
unicode-normalization = "0.1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
