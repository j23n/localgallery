[package]
name = "gallery-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "gallery_ffi"
# `staticlib` is what the app links (via GalleryCore.xcframework); `cdylib` is
# what `uniffi-bindgen` reads the interface metadata out of. `lib` keeps the
# crate usable from Rust tests.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
gallery-meta = { path = "../gallery-meta" }
gallery-ml = { path = "../gallery-ml" }
gallery-model = { path = "../gallery-model" }
gallery-vfs = { path = "../gallery-vfs" }
uniffi = { workspace = true }
