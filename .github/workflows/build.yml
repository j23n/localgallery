name: Build IPA

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build
        run: |
          xcodebuild archive \
            -project LocalGallery.xcodeproj \
            -scheme LocalGallery \
            -destination "generic/platform=iOS" \
            -archivePath build/LocalGallery.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo ""
            echo "========== COMPILATION ERRORS =========="
            grep " error:" build.log || echo "(no error: lines found)"
            echo "========== END ERRORS =========="
            exit "$BUILD_EXIT"
          fi

      - name: Push build errors
        if: failure()
        run: |
          {
            echo "# Build Errors"
            echo ""
            grep " error:" build.log || echo "No error: lines found"
            echo ""
            echo "# Last 50 lines"
            echo ""
            tail -50 build.log
          } > build_errors.txt
          git config user.name "CI"
          git config user.email "ci@localgallery"
          git add build_errors.txt
          git commit -m "CI: build error log [skip ci]"
          git push origin HEAD

      - name: Create IPA
        run: |
          mkdir -p build/Payload
          cp -r build/LocalGallery.xcarchive/Products/Applications/LocalGallery.app build/Payload/
          cd build && zip -r LocalGallery.ipa Payload

      - name: Upload IPA to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/LocalGallery.ipa
